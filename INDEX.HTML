<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neo Barber - Citas</title>
    <link rel="stylesheet" href="NB.CSS">
</head>
<body>
    <!-- Firebase SDK (Versión de Compatibilidad) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <!-- El de Auth no lo estás usando aún, pero si lo dejas, úsalo así: -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>

<div class="container">
    <h1>NEO BARBER</h1>
    <p class="subtitle">SELECCIONA TU CITA PARA HOY O MAÑANA</p>

    <input type="text" id="userName" placeholder="INGRESA TU NOMBRE">
    <input type="tel" id="userPhone" placeholder="NUMERO DE CELULAR">

    <p class="hora-preferida">ESCOGE LA HORA QUE PREFIERES</p>

    <div class="grid-container" id="gridContainer">
        <div class="time-slot available" data-time="9 AM">9 AM</div>
        <div class="time-slot available" data-time="9:30 AM">9:30 AM</div>
        <div class="time-slot available" data-time="10 AM">10 AM</div>
        <div class="time-slot available" data-time="10:30 AM">10:30 AM</div>
        <div class="time-slot available" data-time="11:00 AM">11:00 AM</div>
        <div class="time-slot available" data-time="11:30 AM">11:30 AM</div>
        <div class="time-slot available" data-time="12:00 PM">12:00 PM</div>
        <div class="time-slot available" data-time="12:30 PM">12:30 PM</div>
        <div class="time-slot available" data-time="1:00 PM">1:00 PM</div>
        <div class="time-slot available" data-time="1:30 PM">1:30 PM</div>
        <div class="time-slot available" data-time="2:00 PM">2:00 PM</div>
        <div class="time-slot available" data-time="2:30 PM">2:30 PM</div>
        <div class="time-slot available" data-time="3:00 PM">3:00 PM</div>
        <div class="time-slot available" data-time="3:30 PM">3:30 PM</div>
        <div class="time-slot available" data-time="4:00 PM">4:00 PM</div>
        <div class="time-slot available" data-time="4:30 PM">4:30 PM</div>
    </div>

    <p class="legend">¿LAS VERDES SON LAS HORAS DISPONIBLES!</p>

    <button id="acceptBtn" class="accept-btn">
        <span id="btnText">ACEPTAR CITA</span>
        <div id="loader" class="spinner" style="display: none;"></div>
    </button>

    <div class="pending-section">
        <div class="pending-title">CITAS PENDIENTES HOY</div>
        <ul class="appointment-list" id="appointmentsList">
            <!-- Las citas se cargarán dinámicamente desde Firebase -->
        </ul>
    </div>
</div>

<script src="NB.JS"></script>
</body>
</html>
